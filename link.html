<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HeartFelt Link</title>
	<link rel="stylesheet" href="lab.css">
	<style>
		.link-form {
			max-width: 460px;
			margin: 34px auto 0;
		}

		.link-form label {
			display: block;
			margin-bottom: 9px;
			font-family: Arial, sans-serif;
			font-weight: 700;
		}

		.link-form input {
			width: 100%;
			min-height: 52px;
			padding: 12px 14px;
			border: 1px solid rgba(184, 74, 109, 0.28);
			border-radius: 4px;
			font: 1rem Arial, sans-serif;
		}

		.generated-link {
			margin-top: 24px;
		}

		.generated-link input {
			background: rgba(255, 255, 255, 0.72);
		}
	</style>
</head>
<body>
	<main class="heart-bg" aria-labelledby="link-heading">
		<h1 id="link-heading">Create your link</h1>
		<p>Enter a name to create a personalized HeartFelt link.</p>

		<form class="link-form" id="link-form">
			<label for="name">Name</label>
			<input id="name" name="name" type="text" placeholder="Enter a name" required>
			<button class="begin-button" type="submit">Generate link</button>
		</form>

		<div class="link-form generated-link" hidden>
			<label for="generated-url">Generated link</label>
			<input id="generated-url" type="text" readonly>
			<button class="begin-button" id="copy-link" type="button">Copy link</button>
		</div>
	</main>

	<script>
		const form = document.getElementById('link-form');
		const nameInput = document.getElementById('name');
		const generatedLink = document.querySelector('.generated-link');
		const urlInput = document.getElementById('generated-url');
		const copyButton = document.getElementById('copy-link');

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const url = new URL('urname.html', window.location.href);
			url.searchParams.set('name', nameInput.value.trim());
			urlInput.value = url.href;
			generatedLink.hidden = false;
		});

		copyButton.addEventListener('click', async () => {
			await navigator.clipboard.writeText(urlInput.value);
			copyButton.textContent = 'Copied';
			setTimeout(() => {
				copyButton.textContent = 'Copy link';
			}, 1500);
		});
	</script>
</body>
</html>
